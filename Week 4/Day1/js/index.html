<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Basic input -->
    <label for="basic-input">Animal noise</label>
    <input id="basic-input">

    <br />

    <!-- Numeric input -->
    <label for="age-input">Age</label>
    <input id="age-input" max="10" type="number">

    <br />

    <!-- Dropdown list  -->
    <label for="car-model-input">Car Model</label>
    <select id="car-model-input">
        <!-- Each entry gets an optioin tag -->
         <!-- It's good practice to specify the display name, an id and 
          a value, because these might be different -->
        <option id="Lamburgini" value="Lamurgini">Lamburgini</option>
        <option id="Honda" value="Honda">Honda</option>
        <option id="Toyota" value="Toyota">Toyota</option>
    </select>

    <!-- Drop down list example 2 -->
     <!-- Here the value being saved (state abbreviation) is
      different from what's being shown to the user (full state name) -->
    <label for="statesInput">States</label>
    <select id="states">
        <option id="California" value="CA">Orange</option>
        <option id="Arkansas" value="AR">Arkansas</option>
    </select>

    <br />

    <label>Topping</label>
    <!-- One input element for each checkbox, each needs an id & value, and a label that's tied to it -->
    <input type="checkbox" name="toppings" id="lettuce" value="lettuce"><label for="lettuce">Lettuce</label>
    <input type="checkbox" name="toppings" id="tomato" value="tomato"><label for="tomato">Tomato</label>
    <input type="checkbox" name="toppings" id="anchovy" value="anchovy"><label for="anchovy">Anchovy</label>
    
    <br />
    <!-- The same as checkboxes, but all of the radio options need to share 
     the same name property (truth) -->
    <label>True or False</label>
    <input type="radio" id="true" value="T" name="truth"><label for="true">True</label>
    <input type="radio" id="false" value="F" name="truth"><label for="false">False</label>

    <script src="scripts/script.js" defer></script>
    <script src="scripts/arrays.js" defer></script>
</body>
</html>
