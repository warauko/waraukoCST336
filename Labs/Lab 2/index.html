<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Game</title>
</head>

<body>
    <h1>Number Guessing Game :D</h1>
    
    <p id="triesOutput">Tries left: 7</p>
    <button id="resetButton" hidden>Reset</button>
    <p>Wins: <span id="winsOutput">0</span></p>
    <p>Losses: <span id="lossesOutput">0</span></p>

    <input id="guessInput" type="number">
    <button id="guessButton">Guess!</button>
    <p id="guessMessage">Guess a number between 1 and 99!</p>
    <h2 id="guessOutput"></h2>


    <script src="js/script.js" defer></script>

</body>

</html>
